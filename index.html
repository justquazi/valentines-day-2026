<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Our World</title>
    <link rel="stylesheet" href="style.css" />

    <!-- IMPORT MAP: tells browser what "three" means -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
      }
    </script>
  </head>

  <body>
    <div id="overlay">
      <!-- Phase 1: Title -->
      <div id="intro-title" class="active">
        <h1>Our World</h1>
      </div>

      <!-- Phase 2: Intro content -->
      <div id="intro-content">
        <h2>Our Story</h2>
        <p>
          From where we first met to the places that shaped us, every point on
          this map carries a memory worth keeping.
        </p>
        <button id="startBtn">Go</button>
      </div>
    </div>

    <div id="tooltip"></div>

    <!-- GSAP global (safe) -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <!-- MAIN MODULE -->
    <script type="module" src="main.js"></script>
  </body>
</html>
